spring.application.name=catalogus-service
server.port=8081

# Database: H2 in een bestand zodat de catalogus bewaard blijft na een herstart
spring.datasource.url=jdbc:h2:file:./data/catalogus
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.h2.console.enabled=true

# Gedeeld geheim (min. 32 tekens) om de JWT's van de gebruikers-service te valideren.
# Moet gelijk zijn aan app.jwt.secret in de gebruikers-service. Overschrijf in productie via APP_JWT_SECRET.
app.jwt.secret=dev-geheim-boekenwinkel-verander-dit-in-productie-1234567890
app.jwt.issuer=boekenwinkel-gebruikers-service

# API-sleutel waarmee de gebruikers-service de interne endpoints aanroept. Overschrijf via APP_INTERN_APIKEY.
app.intern.api-key=dev-api-sleutel-boekenwinkel

# Frontend die de API mag aanroepen (komma-gescheiden)
app.cors.allowed-origins=http://localhost:5173
