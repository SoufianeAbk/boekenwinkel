spring.application.name=gebruikers-service
server.port=8082

# Database: H2 in een bestand zodat accounts en reservaties bewaard blijven na een herstart
spring.datasource.url=jdbc:h2:file:./data/gebruikers
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.h2.console.enabled=true

# JWT: gedeeld geheim (min. 32 tekens), moet gelijk zijn aan app.jwt.secret in de catalogus-service.
# Overschrijf in productie via de omgevingsvariabele APP_JWT_SECRET.
app.jwt.secret=dev-geheim-boekenwinkel-verander-dit-in-productie-1234567890
app.jwt.issuer=boekenwinkel-gebruikers-service
app.jwt.geldigheid=8h

# Waar de catalogus-service draait en met welke API-sleutel we de interne endpoints aanroepen.
# De sleutel moet gelijk zijn aan app.intern.api-key in de catalogus-service (overschrijven via APP_CATALOGUS_APIKEY).
app.catalogus.url=http://localhost:8081
app.catalogus.api-key=dev-api-sleutel-boekenwinkel

# Frontend die de API mag aanroepen (komma-gescheiden)
app.cors.allowed-origins=http://localhost:5173

# Accounts die bij de eerste start aangemaakt worden (enkel voor lokale ontwikkeling)
app.seed.admin-wachtwoord=admin1234
app.seed.klant-wachtwoord=klant1234
